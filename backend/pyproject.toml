[project]
name = "productivity-dashboard-backend"
version = "0.1.0"
description = "Offline-first FastAPI backend foundation for the Productivity Boost Dashboard"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<5.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
