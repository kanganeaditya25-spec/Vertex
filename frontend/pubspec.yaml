name: productivity_dashboard
description: Offline-first AI productivity dashboard client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  go_router: ^14.6.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.6.0
  fl_chart: ^0.70.2
  intl: ^0.20.3
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0
  flutter_markdown: ^0.7.4+3
  file_picker: ^8.1.7
  crypto: ^3.0.6
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  pdfx: ^2.8.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
